# Railway config-as-code for the FastAPI API service only (uvicorn serves /health).
#
# Dashboard: Root Directory `backend`, Config as Code path `/backend/railway.toml`
# (path is from repo root; it does not follow Root Directory).
#
# Worker services (Railway UI per service):
# - Config file: `/backend/railway.worker.json` (healthcheck disabled, restart policy).
# - Required variable: RAILWAY_DOCKERFILE_PATH=/backend/Dockerfile.worker so the Docker build
#   uses the worker image (Playwright Chromium). Without this, Railway may build `/backend/Dockerfile`
#   (API image) while still running arq — Chromium will be missing at runtime.
# - Job worker (QUEUE_JOBS): startCommand arq app.workers.job_worker.JobWorkerSettings (Dockerfile CMD default).
# - Apply worker (QUEUE_APPLY): `/backend/railway.apply-worker.json` documents startCommand
#   arq app.workers.apply_worker.ApplyWorkerSettings — deploy as its own service with the same Dockerfile.worker path.
# - AI worker (QUEUE_AI): Dockerfile.ai; set RAILWAY_DOCKERFILE_PATH=/backend/Dockerfile.ai when needed.
# Required on all app/worker services: DATABASE_URL from Postgres (never leave blank);
# workers also need REDIS_URL and the same start command you use in docker-compose (arq ...).
#
# Reference: https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "/backend/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
